<a href="{{ module.url }}" class="module-card">
    <div class="module-card__top">
        <span class="module-card__icon" aria-hidden="true">
            {{ module.icon|safe }}
        </span>

        {% if module.badge %}
            <span class="module-card__badge">
                <span class="module-card__badge-dot"></span>
                {{ module.badge }}
            </span>
        {% endif %}
    </div>

    <div class="module-card__content">
        <span class="module-card__eyebrow">
            {{ module.eyebrow }}
        </span>

        <h3 class="module-card__title">
            {{ module.title }}
        </h3>

        <p class="module-card__description">
            {{ module.description }}
        </p>
    </div>

    {% if module.metrics %}
        <div class="module-card__metrics">
            {% for metric in module.metrics %}
                <div class="module-card__metric">
                    <span class="module-card__metric-label">
                        {{ metric.label }}
                    </span>

                    <strong class="module-card__metric-value">
                        {{ metric.value }}
                    </strong>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <div class="module-card__footer">
        <span class="module-card__arrow" aria-hidden="true">
            →
        </span>
    </div>
</a>
